name: Who Owns What — Daily Update

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC daily — batch scrape + lobby refresh
    - cron: '0 6 * * 1'     # 06:00 UTC Monday — also runs dynamic discovery
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit updated data.js and whoownswhat.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync
        env:
          UV_INDEX_URL: https://pypi.org/simple/

      # ── DATABASE SETUP ─────────────────────────────────────────────────────
      # init_db creates the schema (idempotent — IF NOT EXISTS guards).
      # The DB file is committed to the repo at data/whoownswhat.db.

      - name: Initialise / migrate database schema
        run: uv run python scripts/whoownswhat/init_db.py

      - name: Seed curated static data (Germany Phase I)
        run: uv run python scripts/whoownswhat/seed_db.py

      # ── DISCOVERY ─────────────────────────────────────────────────────────
      # Step 1 — static lists: DAX40 + MDAX50 + TecDAX + SDAX + Private.
      #          Runs daily — INSERT OR IGNORE makes it idempotent.
      # Step 2 — dynamic: Wikidata SPARQL for additional listed companies.
      #          Runs weekly (Mondays only) to avoid queue bloat — controlled
      #          via the second cron schedule in the trigger block.

      - name: Discover German companies — static lists
        run: uv run python scripts/whoownswhat/discover_germany.py

      - name: Discover German companies — dynamic (Wikidata SPARQL, Mondays only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
        run: uv run python scripts/whoownswhat/discover_dynamic.py --country germany --limit 300
        continue-on-error: true   # SPARQL endpoint occasionally rate-limits; don't block the pipeline

      # ── DAILY BATCH SCRAPE ────────────────────────────────────────────────
      # Picks the next 25 pending/needs_refresh companies from the queue
      # (needs_refresh first, then DAX40, then MDAX).
      # Each run processes: Wikipedia → Wikidata SPARQL → Bundestag Lobbyregister.
      # At 25 per day, 137 pending clears in ~6 days.
      # Entities with <2/4 critical fields filled are marked 'needs_refresh'
      # and re-queued automatically on the next run.

      - name: Scrape company batch (25 per day)
        run: uv run python scripts/whoownswhat/scrape_company_batch.py --batch 25
        continue-on-error: true

      # ── DB CLEANUP ────────────────────────────────────────────────────────
      # Remove boilerplate rows and normalise placeholder values (sector "—",
      # bare "Germany" HQ, empty scalar fields) before scraping.

      - name: Clean database (normalise placeholders)
        run: uv run python scripts/whoownswhat/clean_db.py
        continue-on-error: true

      # ── LOBBY REGISTER REFRESH ────────────────────────────────────────────
      # Refresh lobbying budgets for all scraped German entities.
      # Dynamically loads entity list from DB (not hardcoded).

      - name: Refresh Bundestag Lobby Register (all German entities)
        run: uv run python scripts/whoownswhat/scrape_lobbying_register.py
        continue-on-error: true

      # ── SHAREHOLDER SCRAPE ────────────────────────────────────────────────
      # Two complementary sources:
      #   1. Wikidata SPARQL (P127) — strategic/founding shareholders (Quandt, QIA…)
      #   2. Yahoo Finance via yfinance — institutional holders (BlackRock, Vanguard…)

      - name: Scrape shareholders — Wikidata SPARQL (strategic owners)
        run: uv run python scripts/whoownswhat/scrape_shareholders_wikidata.py
        continue-on-error: true

      - name: Scrape shareholders — Yahoo Finance (institutional holders)
        run: uv run python scripts/whoownswhat/scrape_institutional_holders.py
        continue-on-error: true

      # ── EXPORT ────────────────────────────────────────────────────────────
      # Regenerate data.js from the updated database.

      - name: Export data.js from database
        run: uv run python scripts/whoownswhat/export_data_js.py

      # ── COMMIT ────────────────────────────────────────────────────────────

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whoownswhat/data.js data/whoownswhat.db
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore(whoownswhat): daily data update [skip ci]"
          git push

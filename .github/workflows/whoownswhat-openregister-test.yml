name: Who Owns What — OpenRegister Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - run: uv sync

      - name: Init DB
        run: uv run python scripts/whoownswhat/init_db.py

      - name: Seed DB
        run: uv run python scripts/whoownswhat/seed_db.py

      - name: Discover companies
        run: uv run python scripts/whoownswhat/discover_germany.py

      - name: Show enrichment candidates
        run: |
          sqlite3 data/whoownswhat.db \
            "SELECT count(*) || ' companies need enrichment (revenue or other fields NULL)' FROM entities WHERE type='company' AND country='germany' AND (sector IS NULL OR headquarters IS NULL OR founded IS NULL OR employees IS NULL OR revenue IS NULL)"

      - name: Run OpenRegister scraper (limit 5)
        env:
          OPENREGISTER_API_KEY: ${{ secrets.OPENREGISTER_API_KEY }}
        run: uv run python scripts/whoownswhat/scrape_openregister.py --limit 5

      - name: Verify data written
        run: |
          sqlite3 data/whoownswhat.db \
            "SELECT name, sector, headquarters, founded, employees, revenue FROM entities WHERE type='company' AND country='germany' AND openregister_id IS NOT NULL LIMIT 10"

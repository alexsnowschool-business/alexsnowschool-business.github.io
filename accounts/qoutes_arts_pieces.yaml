handle: "@qoutes_arts_pieces"
niche: "art"

quotes_db: "data/quotes.db"
art_db:    "data/art.db"

exclude_religious: true

scrape_tags:
  - burnout
  - midlife
  - purpose
  - anxiety
  - loneliness
  - career
  - meaning
  - identity
  - change
  - simplicity
  - balance
  - technology
  - solitude
  - truth
  - time
  - art
  - creativity
  - beauty
  - artist
  - painting
  - imagination
  - aesthetics
  - sculpture
  - gallery
  - exhibition
  - masterpiece
  - canvas
  - museum
  - craftsmanship
  - inspiration
  - vision

hashtags_tiktok: >-
  #artquotes #fineart #artistsoninstagram #quotesoftheday  #fyp

hashtags_instagram: >-
  #artquotes #fineart #quotesoftheday

buffer_token_env:        "PROVENANCE_BUFFER_TOKEN"
buffer_tiktok_id_env:    "PROVENANCE_BUFFER_TIKTOK_ID"
buffer_instagram_id_env: "PROVENANCE_BUFFER_INSTAGRAM_ID"
buffer_youtube_id_env:   "PROVENANCE_BUFFER_YOUTUBE_ID"

